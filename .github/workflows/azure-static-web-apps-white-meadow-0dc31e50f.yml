name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  verify:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install web dependencies
        run: npm ci
      - name: Install Functions API dependencies
        run: npm ci
        working-directory: api
      - name: Test web app
        run: npm test
      - name: Test Functions API
        run: npm test
        working-directory: api
      - name: Build web app
        run: npm run build
      - name: Build Functions API
        run: npm run build
        working-directory: api

  build_and_deploy_job:
    # Azure staging environments are at capacity. Pull requests are fully
    # verified above; only a merge to main publishes to production.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: verify
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          lfs: false
      - name: Get Azure OIDC token
        uses: actions/github-script@v8
        id: idtoken
        with:
          script: return await core.getIDToken()
          result-encoding: string
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          INPUT_GITHUB_ID_TOKEN: ${{ steps.idtoken.outputs.result }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_MEADOW_0DC31E50F }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "api" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######
      - name: Verify deployed health endpoint
        if: github.event_name == 'push'
        run: curl --fail --retry 6 --retry-delay 10 https://white-meadow-0dc31e50f.7.azurestaticapps.net/api/health
